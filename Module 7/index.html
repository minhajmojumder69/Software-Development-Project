<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container-fluid d-flex justify-content-around">
                <a class="navbar-brand">Drinks Shop</a>
                <form class="searchbar d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search by name or first letter" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </nav>
    </header>
    <main>

        <div class="main-conteiner d-flex justify-content-evenly mt-3 row">
            <div id="product-container" class="product-conteiner col-8">
            
            </div>
            <div id="cart-conteiner" class="cart-conteiner col-3">
                <h2>Total Cart: <span id="total" class="total">0</span></h2>
                <div class="cart-title">
                    <li>Img</li>
                    <li>Name</li>
                </div>
            </div>
        </div>

    </main>
    
    <script src="project.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
